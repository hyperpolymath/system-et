# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
#
# OSSF Scorecard, after `scorecard.yml` of the estate template
# (hyperpolymath/rsr-template-repo). It runs on a schedule and on manual dispatch.
#
# The earlier form of this file called the reusable workflow `scorecard-reusable.yml` of the
# standards repository. That call did not start: each run failed with no job.
name: OSSF Scorecard

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scorecard:
    if: github.event_name != 'pull_request'
    name: OSSF Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Upload Scorecard SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4.39.2
        with:
          sarif_file: results.sarif
          category: scorecard
