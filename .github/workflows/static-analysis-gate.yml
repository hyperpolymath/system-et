# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# This workflow is managed by gh actions-lock.
# This workflow is managed by gh actions-lock.
# Static Analysis Gate — scanner absence, malformed evidence, or execution failure is a failure.
# Runs pinned panic-attack and Hypatia sources, then deposits only validated findings.
name: Static Analysis Gate
on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # ---------------------------------------------------------------------------
  # Job 1: panic-attack assail
  # ---------------------------------------------------------------------------
  panic-attack-assail:
    name: panic-attack assail
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Build panic-attack from the pinned source revision
        env:
          PANIC_ATTACK_SHA: 7b9f145c2194eb0d46ace82a5a4518db5db38a5e
        run: |
          set -euo pipefail
          command -v rustup >/dev/null 2>&1 || { echo "::error::rustup is required to build pinned panic-attack"; exit 1; }
          rustup toolchain install 1.90.0 --profile minimal
          src="$RUNNER_TEMP/panic-attack-src"
          git init "$src"
          git -C "$src" remote add origin https://github.com/hyperpolymath/panic-attack.git
          git -C "$src" fetch --depth=1 origin "$PANIC_ATTACK_SHA"
          git -C "$src" checkout --detach FETCH_HEAD
          actual="$(git -C "$src" rev-parse HEAD)"
          [[ "$actual" == "$PANIC_ATTACK_SHA" ]] || { echo "::error::panic-attack source revision mismatch"; exit 1; }
          cargo +1.90.0 build --locked --release --features http --manifest-path "$src/Cargo.toml" --bin panic-attack
          mkdir -p "$RUNNER_TEMP/static-analysis-bin"
          install -m 0755 "$src/target/release/panic-attack" "$RUNNER_TEMP/static-analysis-bin/panic-attack"
          echo "$RUNNER_TEMP/static-analysis-bin" >> "$GITHUB_PATH"
      - name: Run panic-attack assail
        id: assail
        run: |
          set -euo pipefail
          panic-attack --quiet assail . --headless --fail-on-incomplete > panic-attack-findings.json
          bash scripts/validate-static-analysis-json.sh assail panic-attack-findings.json "$GITHUB_OUTPUT"
      - name: Emit check annotations
        run: |
          # Convert JSON findings into GitHub Actions annotations
          # Escape untrusted scanner fields before emitting workflow commands.
          # AssailReport is an object with `weak_points`, not a top-level array.
          jq -r --arg ws "$GITHUB_WORKSPACE" '
            def msg: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def prop: msg | gsub(":"; "%3A") | gsub(","; "%2C");
            .weak_points[] | select(.suppressed != true) |
            ((.file // .location // "unknown") | sub("^" + $ws + "/"; "") | prop) as $f |
            ((.description // "finding") | msg) as $m |
            ((.line // 1) | tostring | prop) as $line |
            if .severity == "Critical" or .severity == "High" then
              "::error file=\($f),line=\($line)::[panic-attack] \($m)"
            else
              "::warning file=\($f),line=\($line)::[panic-attack] \($m)"
            end
          ' panic-attack-findings.json
      - name: Write step summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## panic-attack assail Results

          | Severity | Count |
          |----------|-------|
          | Critical | ${{ steps.assail.outputs.critical }} |
          | High     | ${{ steps.assail.outputs.high }} |
          | Medium   | ${{ steps.assail.outputs.medium }} |
          | Low      | ${{ steps.assail.outputs.low }} |
          | **Total**| ${{ steps.assail.outputs.total }} |
          EOF
      - name: Upload panic-attack findings
        uses: actions/upload-artifact@v7.0.2
        with:
          name: panic-attack-findings
          path: panic-attack-findings.json
          retention-days: 90
      - name: Fail on critical findings
        if: steps.assail.outputs.critical > 0
        run: |
          echo "::error::panic-attack found ${{ steps.assail.outputs.critical }} critical issue(s) — blocking merge"
          exit 1
  # ---------------------------------------------------------------------------
  # Job 2: hypatia-scan
  #
  # NOTE — this is NOT a duplicate of the standalone `hypatia-scan.yml`.
  #   * THIS job runs Hypatia inside the gate and hands its findings to the
  #     `deposit-findings` job below, which feeds the gitbot-fleet LEARNING
  #     pipeline (artifact -> fleet). It is a REQUIRED status check.
  #   * `hypatia-scan.yml` runs Hypatia standalone as the repo's security scan,
  #     independent of the fleet-learning deposit.
  # Same tool, two different consumers — keep both. See .github/workflows/README.adoc.
  # ---------------------------------------------------------------------------
  hypatia-scan:
    name: Hypatia neurosymbolic scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Elixir for Hypatia scanner
        id: beam
        uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.19.4'
          otp-version: '28.3'
      - name: Clone and build Hypatia at a fixed revision
        env:
          HYPATIA_SHA: d158aed87f76b93e4f291e995bef9f26559c7fb2
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/hypatia-src"
          git init "$src"
          git -C "$src" remote add origin https://github.com/hyperpolymath/hypatia.git
          git -C "$src" fetch --depth=1 origin "$HYPATIA_SHA"
          git -C "$src" checkout --detach FETCH_HEAD
          actual="$(git -C "$src" rev-parse HEAD)"
          [[ "$actual" == "$HYPATIA_SHA" ]] || { echo "::error::Hypatia source revision mismatch"; exit 1; }
          [[ -f "$src/mix.exs" && -f "$src/mix.lock" ]] || { echo "::error::pinned Hypatia source lacks its project or dependency lock"; exit 1; }
          cd "$src"
          mix deps.get --check-locked
          mix escript.build
          mkdir -p "$RUNNER_TEMP/static-analysis-bin"
          install -m 0755 hypatia "$RUNNER_TEMP/static-analysis-bin/hypatia"
      - name: Run Hypatia scan
        id: scan
        run: |
          set -euo pipefail
          HYPATIA_FORMAT=json "$RUNNER_TEMP/static-analysis-bin/hypatia" scan . --exit-zero > hypatia-findings.json

          # --exit-zero is Hypatia's own documented CI recipe (lib/hypatia/cli.ex),
          # for exactly this case: "use in CI when a downstream step gates on
          # severity counts". Findings go to stdout, the one-line summary to
          # stderr, and the process exits 0 unless the SCANNER itself failed.
          #
          # Do NOT redirect stderr into the payload with `2>&1`: that folds the
          # summary line into the JSON, so every parse fails, the old `[]`
          # fallback substituted a clean result, CRITICAL was always 0, and the
          # gate below could never fire on any input. Keep stderr on the log.
          bash scripts/validate-static-analysis-json.sh hypatia hypatia-findings.json "$GITHUB_OUTPUT"
      - name: Emit check annotations
        run: |
          # Findings carry no `.message` (keys: action,file,line,reason,rule_module,
          # severity,type), so every annotation read "null". `.file` is an absolute
          # runner path, which GitHub cannot anchor to the diff, so it is made
          # workspace-relative here.
          jq -r --arg ws "$GITHUB_WORKSPACE" '
            def msg: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def prop: msg | gsub(":"; "%3A") | gsub(","; "%2C");
            .[] |
            ((if .file == "" then "unknown" else .file end) | sub("^" + $ws + "/"; "") | prop) as $f |
            ((.reason // .message // .type) | msg) as $m |
            ((.line // 1) | tostring | prop) as $line |
            if .severity == "critical" or .severity == "high" then
              "::error file=\($f),line=\($line)::[hypatia] \($m)"
            else
              "::warning file=\($f),line=\($line)::[hypatia] \($m)"
            end
          ' hypatia-findings.json
      - name: Write step summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Hypatia Scan Results

          | Severity | Count |
          |----------|-------|
          | Critical | ${{ steps.scan.outputs.critical }} |
          | High     | ${{ steps.scan.outputs.high }} |
          | Medium   | ${{ steps.scan.outputs.medium }} |
          | Low      | ${{ steps.scan.outputs.low }} |
          | **Total**| ${{ steps.scan.outputs.total }} |
          EOF
      - name: Upload hypatia findings
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hypatia-findings
          path: hypatia-findings.json
          retention-days: 90
      - name: Fail on critical security findings
        if: steps.scan.outputs.critical > 0
        run: |
          echo "::error::Hypatia found ${{ steps.scan.outputs.critical }} critical security issue(s) — blocking merge"
          exit 1
  # ---------------------------------------------------------------------------
  # Job 3: patch-bridge triage (CVE contextual assessment)
  # ---------------------------------------------------------------------------
  patch-bridge-triage:
    name: Patch Bridge CVE triage (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Detect supported dependency lockfiles
        id: applicability
        run: |
          set -euo pipefail
          tracked="$(mktemp)"
          trap 'rm -f "$tracked"' EXIT
          if ! git ls-files -z > "$tracked"; then
            echo "::error::failed to list tracked files for Patch Bridge"
            exit 1
          fi
          applicable=false
          while IFS= read -r -d '' path; do
            case "${path##*/}" in
              Cargo.lock|mix.lock|package-lock.json|requirements.txt) applicable=true ;;
            esac
          done < "$tracked"
          printf 'applicable=%s\n' "$applicable" >> "$GITHUB_OUTPUT"
      - name: Build panic-attack from the pinned source revision
        if: steps.applicability.outputs.applicable == 'true'
        env:
          PANIC_ATTACK_SHA: 7b9f145c2194eb0d46ace82a5a4518db5db38a5e
        run: |
          set -euo pipefail
          command -v rustup >/dev/null 2>&1 || { echo "::error::rustup is required to build pinned panic-attack"; exit 1; }
          rustup toolchain install 1.90.0 --profile minimal
          src="$RUNNER_TEMP/panic-attack-src"
          git init "$src"
          git -C "$src" remote add origin https://github.com/hyperpolymath/panic-attack.git
          git -C "$src" fetch --depth=1 origin "$PANIC_ATTACK_SHA"
          git -C "$src" checkout --detach FETCH_HEAD
          actual="$(git -C "$src" rev-parse HEAD)"
          [[ "$actual" == "$PANIC_ATTACK_SHA" ]] || { echo "::error::panic-attack source revision mismatch"; exit 1; }
          cargo +1.90.0 build --locked --release --features http --manifest-path "$src/Cargo.toml" --bin panic-attack
          mkdir -p "$RUNNER_TEMP/static-analysis-bin"
          install -m 0755 "$src/target/release/panic-attack" "$RUNNER_TEMP/static-analysis-bin/panic-attack"
          echo "$RUNNER_TEMP/static-analysis-bin" >> "$GITHUB_PATH"
      - name: Run Patch Bridge triage
        id: triage
        if: steps.applicability.outputs.applicable == 'true'
        run: |
          set -euo pipefail
          panic-attack --quiet bridge triage . --output bridge-report.json
          bash scripts/validate-static-analysis-json.sh bridge bridge-report.json "$GITHUB_OUTPUT"
      - name: Record Patch Bridge as explicitly not applicable
        id: not_applicable
        if: steps.applicability.outputs.applicable == 'false'
        run: |
          set -euo pipefail
          printf '%s\n' '{"status":"not_applicable","reason":"no supported dependency lockfile is present"}' > bridge-report.json
          bash scripts/validate-static-analysis-json.sh bridge bridge-report.json "$GITHUB_OUTPUT"
      - name: Write step summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Patch Bridge CVE Triage

          | Classification | Count |
          |----------------|-------|
          | Applicability  | ${{ steps.triage.outputs.bridge_status || steps.not_applicable.outputs.bridge_status || 'unknown' }} |
          | Unmitigable    | ${{ steps.triage.outputs.unmitigable || steps.not_applicable.outputs.unmitigable || 'n/a' }} |
          | Mitigated      | ${{ steps.triage.outputs.mitigated || steps.not_applicable.outputs.mitigated || 'n/a' }} |
          | Concatenative  | ${{ steps.triage.outputs.concatenative || steps.not_applicable.outputs.concatenative || 'n/a' }} |
          | Informational  | ${{ steps.triage.outputs.informational || steps.not_applicable.outputs.informational || 'n/a' }} |

          Unmitigable CVEs require dependency replacement or rearchitecture.
          Mitigated CVEs have active controls with soundness proofs.
          Concatenative risks are CVE combinations that multiply severity.
          EOF
      - name: Upload bridge report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bridge-report
          path: bridge-report.json
          retention-days: 90
      - name: Report unmitigable CVEs for human review
        if: steps.applicability.outputs.applicable == 'true' && steps.triage.outputs.unmitigable > 0
        run: |
          echo "::warning::Patch Bridge found ${{ steps.triage.outputs.unmitigable }} unmitigable CVE(s) — review required"
          # Warning only, not blocking. Unmitigable means the developer needs
          # to make an architectural decision, not that the PR is wrong.
  # ---------------------------------------------------------------------------
  # Job 4: deposit-findings (combines + archives for gitbot-fleet)
  # ---------------------------------------------------------------------------
  deposit-findings:
    name: Deposit findings for gitbot-fleet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [panic-attack-assail, hypatia-scan, patch-bridge-triage]
    if: always()
    steps:
      - name: Checkout repository for report validation
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Download panic-attack findings
        uses: actions/download-artifact@v8.0.2
        with:
          name: panic-attack-findings
          path: findings/
      - name: Download hypatia findings
        uses: actions/download-artifact@v8.0.2
        with:
          name: hypatia-findings
          path: findings/
      - name: Download bridge report
        uses: actions/download-artifact@v8.0.2
        with:
          name: bridge-report
          path: findings/
      - name: Combine findings into unified report
        id: combine
        run: |
          PA_FILE="findings/panic-attack-findings.json"
          HYP_FILE="findings/hypatia-findings.json"

          # These files are evidence from successful, schema-validated scanner jobs.
          # Missing, empty, or malformed artifacts are an infrastructure failure.
          bash scripts/validate-static-analysis-json.sh assail "$PA_FILE" "$RUNNER_TEMP/pa-counts"
          bash scripts/validate-static-analysis-json.sh hypatia "$HYP_FILE" "$RUNNER_TEMP/hyp-counts"

          # Tag each finding with its source scanner
          jq '[.weak_points[] | . + {"scanner": "panic-attack"}]' "$PA_FILE" > /tmp/pa-tagged.json
          jq '[.[] | . + {"scanner": "hypatia"}]'      "$HYP_FILE" > /tmp/hyp-tagged.json

          # Read bridge report (CVE triage, not findings array)
          BRIDGE_FILE="findings/bridge-report.json"
          bash scripts/validate-static-analysis-json.sh bridge "$BRIDGE_FILE" "$RUNNER_TEMP/bridge-counts"

          # Build unified report envelope
          jq -n \
            --arg repo   "${{ github.repository }}" \
            --arg sha    "${{ github.sha }}" \
            --arg ref    "${{ github.ref }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg ts     "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile pa     /tmp/pa-tagged.json \
            --slurpfile hyp    /tmp/hyp-tagged.json \
            --slurpfile bridge "$BRIDGE_FILE" \
            '{
              schema_version: "1.1.0",
              repository: $repo,
              commit_sha: $sha,
              ref: $ref,
              run_id: $run_id,
              timestamp: $ts,
              findings: ($pa[0] + $hyp[0]),
              patch_bridge: $bridge[0]
            }' > findings/unified-findings.json

          TOTAL=$(jq '[.findings[] | select(.suppressed != true)] | length' findings/unified-findings.json)
          CRITICAL=$(jq '[.findings[] | select(.suppressed != true) | select(.severity == "critical" or .severity == "Critical")] | length' findings/unified-findings.json)
          HIGH=$(jq '[.findings[] | select(.suppressed != true) | select(.severity == "high" or .severity == "High")] | length' findings/unified-findings.json)
          MEDIUM=$(jq '[.findings[] | select(.suppressed != true) | select(.severity == "medium" or .severity == "Medium")] | length' findings/unified-findings.json)
          LOW=$(jq '[.findings[] | select(.suppressed != true) | select(.severity == "low" or .severity == "Low")] | length' findings/unified-findings.json)

          echo "total=$TOTAL"       >> "$GITHUB_OUTPUT"
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH"         >> "$GITHUB_OUTPUT"
          echo "medium=$MEDIUM"     >> "$GITHUB_OUTPUT"
          echo "low=$LOW"           >> "$GITHUB_OUTPUT"
      - name: Upload unified findings (fleet scanner picks these up)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unified-findings
          path: findings/unified-findings.json
          retention-days: 90
      - name: Write deposit summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Unified Findings Deposit

          **Repository:** ${{ github.repository }}
          **Commit:** \`${{ github.sha }}\`
          **Deposited at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          | Severity | Count |
          |----------|-------|
          | Critical | ${{ steps.combine.outputs.critical }} |
          | High     | ${{ steps.combine.outputs.high }} |
          | Medium   | ${{ steps.combine.outputs.medium }} |
          | Low      | ${{ steps.combine.outputs.low }} |
          | **Total**| ${{ steps.combine.outputs.total }} |

          Findings saved as \`unified-findings\` artifact.
          The gitbot-fleet scanner will ingest these on its next pass.
          EOF
